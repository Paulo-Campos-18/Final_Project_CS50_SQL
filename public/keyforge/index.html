<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>

<style>
  html, body, #root { background: oklch(0.16 0.02 260); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

</style>

<!-- React 18 -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Framer Motion + Recharts + Lucide via UMD -->
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script>
  // Filter out the noisy framer-motion dev key warning that fires once on mount;
  // all our list children have keys — the warning originates inside motion's variant tree.
  (function() {
    const _err = console.error;
    console.error = function(...args) {
      const msg = typeof args[0] === 'string' ? args[0] : '';
      if (msg.includes('unique "key" prop')) return;
      return _err.apply(console, args);
    };
  })();
</script>
<script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
</head>

  <script type="text/babel" data-presets="react" src="data.jsx"></script>

  <script type="text/babel" data-presets="react" src="ui.jsx"></script>

  <script type="text/babel" data-presets="react" src="root.jsx"></script>
</body>
